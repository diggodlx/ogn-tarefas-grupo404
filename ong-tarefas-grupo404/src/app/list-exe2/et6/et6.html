<p>Exercício 6</p>

<button (click)="restaurarLista()">
  Restaurar lista inicial
</button>

<p>
  <strong>Quantidade total:</strong> {{ nomes.length }}
</p>

@if (nomes.length > 0) {
  <h3>Nomes cadastrados:</h3>

  <ul>
    @for (nome of nomes; track $index) {
      <li>
        {{ nome }}
      </li>
    }
  </ul>
} @else {
  <p>
    Nenhum nome cadastrado
  </p>
}
