<p>Exercício 8</p>


<h2>Lista de Produtos</h2>

<div *ngFor="let produto of produtos; let i = index">

  <h3>Produto {{ i + 1 }}</h3>

  <p><strong>Nome:</strong> {{ produto.nome }}</p>

  <p><strong>Preço:</strong> {{ produto.preco | currency:'BRL':'symbol':'1.2-2' }}</p>

  <p><strong>Quantidade disponível:</strong> {{ produto.quantidade }}</p>

  <p>
    <strong>Valor total em estoque:</strong>
    {{ produto.preco * produto.quantidade | currency:'BRL':'symbol':'1.2-2' }}
  </p>

  <hr>

</div>
